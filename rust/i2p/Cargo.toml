[package]
name = "privachain_i2p"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "I2P SAMv3 tunnel integration for PrivaChain"

[dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
anyhow = "1.0"
base32 = "0.5"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
i2pd-sys = { path = "../i2pd-sys", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = "0.3"

[features]
default = []
i2p = []
embedded = ["dep:i2pd-sys"]
