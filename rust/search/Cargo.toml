[package]
name = "privachain_search"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
cid = "0.11"
libipld = "0.16"
tantivy = "0.25"
rust-stemmers = "1.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
uniffi = "0.29"
reqwest = { version = "0.12", features = ["blocking"] }
chrono = "0.4"
bm25 = "2.3"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
