[workspace]
members = [
    "src-tauri",
    "messenger",
    "contracts/did-registry",
    "contracts/domain-registry", 
    "contracts/recovery_code",
    "contracts/mail",
    "dpi-bypass",
    "packages/resolver/wasm",
    "node",
    "rust/crypto",
    "rust/crypto/ffi",
    "rust/search",
    "rust/node"
]
resolver = "2"

[workspace.dependencies]
# Minimal tokio instead of full features for smaller binaries
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
# arti-client with minimal features for Tor integration (use in workspace members as needed)
arti-client = { version = "0.34", default-features = false, features = ["native-tls"] }

# ---------- NIST-FIPS-203/204 + ZK (v4.0) ----------
pqcrypto-kyber = { version = "0.8", optional = true }
pqcrypto-dilithium = { version = "0.6", optional = true }
# ---------- ZK libraries (Oct 2025) ----------
ark-snark = { version = "0.4", optional = true }
ark-groth16 = { version = "0.4", optional = true }
ark-stark = { version = "0.4", optional = true }
ark-bls12-381 = { version = "0.4", optional = true }
ark-ff = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }
circom-compat = { version = "0.2", optional = true }
