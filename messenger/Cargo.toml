[package]
name = "privachain_messenger"
version = "0.1.0"
edition = "2021"

[dependencies]
pqc_kyber = { version = "0.7", features = ["std"] }
pqc_dilithium = { version = "0.2", features = ["aes"] }
rand = "0.8"
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
x25519-dalek = "2.0"
ed25519-dalek = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
# ZK-SNARK dependencies for Groth16
bellman = "0.14"
bls12_381 = "0.8"
ff = "0.13"
group = "0.13"

[lib]
name = "privachain_messenger"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"