[package]
name = "gecko_engine"
version = "0.1.0"
edition = "2021"
description = "Gecko (Firefox) engine wrapper for PrivaChain"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["process", "sync"] }
portpicker = "0.1"

[lib]
name = "gecko_engine"
crate-type = ["rlib"]
