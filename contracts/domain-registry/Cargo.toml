[package]
name = "privachain-domain-registry"
version = "0.1.0"
authors = ["PrivaChain Team <dev@privachain.network>"]
edition = "2021"
description = "Real .prv domain registry contract with ZK proof validation - NO STUBS"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []

[dependencies]
cosmwasm-schema = "1.5"
cosmwasm-std = "1.5"
cosmwasm-storage = "1.5"
cw-storage-plus = "1.2"
cw2 = "1.1"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
cw-multi-test = "0.16"