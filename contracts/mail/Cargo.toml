[package]
name = "privachain-mail"
version = "0.2.0"
authors = ["PrivaChain Team <team@privachain.org>"]
edition = "2021"

exclude = [
  # Files generated by Rust
  "**/*.rs.bk",
  "bin/",
  "pkg/",
  "wasm-pack.log",
]

[lib]
path = "src/lib.rs"  # Use relative paths
crate-type = ["cdylib", "rlib"]  # Explicitly set for WASM compatibility

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
default = ["staking"]
staking = []
# Enable contract migration
library = []

[package.metadata.scripts]
optimize = """docker run --rm -v "$(pwd)":/code \
  --mount type=volume,source="$(basename "$(pwd)")_cache",target=/code/target \
  --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
  cosmwasm/rust-optimizer:0.12.13
"""

[dependencies]
cosmwasm-schema = "1.5.11"
cosmwasm-std = "1.5.11"
cosmwasm-storage = "1.5.2"
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
cw-utils = "1.0.3"  # For reentrancy protection
ark-groth16 = "0.4"
ark-bn254 = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"
ark-snark = "0.4"
serde_json = "1.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = { version = "1.0" }
sha2 = "0.10"
hex = "0.4"
env_logger = "0.10.0"
log = "0.4.17"

[dev-dependencies]
cw-multi-test = "0.16.5"
cosmwasm-schema = "1.5.11"

[[example]]
name = "schema_mail"
path = "examples/schema_mail.rs"