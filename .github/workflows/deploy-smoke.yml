name: Deploy & Smoke

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual deployment)'
        required: false
        type: boolean
        default: true
      use_mainnet:
        description: 'Deploy to mainnet (osmosis-1) instead of testnet'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -e
          echo "Updating package lists..."
          sudo apt update || {
            echo "❌ apt update failed"
            exit 1
          }
          echo "Installing system dependencies..."
          sudo apt install -y jq curl git python3 python3-venv || {
            echo "❌ Failed to install system dependencies"
            exit 1
          }
          echo "✅ System dependencies installed"

      - name: Install Osmosis binary
        run: |
          set -e
          echo "Downloading Osmosis binary v21.0.0..."
          # Retry mechanism for download
          success=false
          for i in {1..5}; do
            # Show errors on last attempt, otherwise suppress to avoid noise
            if [ "$i" -eq 5 ]; then
              if wget -O osmosisd https://github.com/osmosis-labs/osmosis/releases/download/v21.0.0/osmosisd-21.0.0-linux-amd64 2>&1; then
                success=true
                break
              fi
            else
              if wget -q -O osmosisd https://github.com/osmosis-labs/osmosis/releases/download/v21.0.0/osmosisd-21.0.0-linux-amd64; then
                success=true
                break
              fi
            fi
            echo "⚠️  Download attempt $i failed"
            if [ "$i" -lt 5 ]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          done

          if [ "$success" = false ]; then
            echo "❌ Failed to download Osmosis binary after 5 attempts"
            exit 1
          fi

          if [[ ! -f osmosisd ]]; then
            echo "❌ Osmosis binary not found after download"
            exit 1
          fi

          # Verify the downloaded file is not empty
          if [[ ! -s osmosisd ]]; then
            echo "❌ Osmosis binary is empty (size: $(stat -c%s osmosisd 2>/dev/null || echo 0) bytes)"
            exit 1
          fi

          chmod +x osmosisd
          sudo mv osmosisd /usr/local/bin/

          # Verify installation
          if ! command -v osmosisd &> /dev/null; then
            echo "❌ osmosisd not found in PATH after installation"
            exit 1
          fi

          echo "✅ Osmosis binary installed: $(osmosisd version)"

      - name: Install I2P router (i2pd)
        run: |
          set -e
          echo "Installing i2pd I2P router..."

          # Add i2pd repository
          sudo apt update || {
            echo "❌ apt update failed"
            exit 1
          }

          # Install i2pd
          sudo apt install -y i2pd || {
            echo "❌ Failed to install i2pd"
            exit 1
          }

          # Configure SAM bridge
          echo "Configuring SAM bridge..."
          sudo mkdir -p /etc/i2pd
          cat << 'EOFCONFIG' | sudo tee /etc/i2pd/i2pd.conf > /dev/null
          [sam]
          enabled = true
          address = 127.0.0.1
          port = 7656
          EOFCONFIG

          # Start i2pd service
          sudo systemctl start i2pd || {
            echo "⚠️  Failed to start i2pd service, trying manual start"
            sudo i2pd --daemon --sam.enabled=true --sam.address=127.0.0.1 --sam.port=7656 &
            sleep 5
          }

          # Verify SAM bridge is listening
          if netstat -tuln 2>/dev/null | grep -q ":7656" || ss -tuln 2>/dev/null | grep -q ":7656"; then
            echo "✅ I2P router installed and SAM bridge running on port 7656"
          else
            echo "⚠️  SAM bridge may not be running on port 7656"
          fi

      - name: Install Filebase CLI
        run: |
          set -e
          echo "Installing Filebase CLI via npm..."
          # Try npm installation first (recommended method)
          if npm install -g @filebase/cli; then
            echo "✅ Filebase CLI installed via npm"
            # Verify installation
            if command -v filebase &> /dev/null; then
              filebase version || echo "✅ Filebase CLI installed"
            else
              echo "⚠️  filebase command not found, but npm package installed"
            fi
          else
            echo "⚠️  npm installation failed, trying binary download..."
            # Fallback to binary download with retry mechanism
            # Note: Using v0.0.2 as latest tag doesn't have linux-amd64 binary available
            success=false
            for i in {1..5}; do
              # Show errors on last attempt, otherwise suppress to avoid noise
              if [ "$i" -eq 5 ]; then
                if curl -L --max-time 60 https://github.com/filebase/filebase-cli/releases/download/v0.0.2/filebase-linux-amd64 -o filebase 2>&1; then
                  success=true
                  break
                fi
              else
                if curl -L -s --max-time 60 https://github.com/filebase/filebase-cli/releases/download/v0.0.2/filebase-linux-amd64 -o filebase; then
                  success=true
                  break
                fi
              fi
              echo "⚠️  Download attempt $i failed"
              if [ "$i" -lt 5 ]; then
                echo "Retrying in 5 seconds..."
                sleep 5
              fi
            done

            if [ "$success" = false ]; then
              echo "❌ Failed to download Filebase CLI after 5 attempts"
              exit 1
            fi

            if [[ -f filebase ]]; then
              # Verify the downloaded file is not empty
              if [[ ! -s filebase ]]; then
                echo "❌ Filebase CLI binary is empty (size: $(stat -c%s filebase 2>/dev/null || echo 0) bytes)"
                exit 1
              fi
              chmod +x filebase
              sudo mv filebase /usr/local/bin/
              echo "✅ Filebase CLI installed from binary"
            else
              echo "❌ Failed to install Filebase CLI"
              exit 1
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: |
          set -e
          echo "Installing Node.js dependencies..."
          npm ci || {
            echo "❌ Failed to install Node.js dependencies"
            exit 1
          }

          # Verify critical dependencies are installed
          if [[ ! -d "node_modules" ]]; then
            echo "❌ node_modules directory not found after installation"
            exit 1
          fi

          echo "✅ Node.js dependencies installed"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo-make
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-make
            ~/.cargo/bin/makers
          key: ${{ runner.os }}-cargo-make-v0.37.20
          restore-keys: |
            ${{ runner.os }}-cargo-make-

      - name: Install cargo-make
        run: |
          set -e
          if ! command -v cargo-make &> /dev/null; then
            echo "Installing cargo-make..."
            # Install with timeout protection
            timeout 600 cargo install --locked cargo-make || {
              echo "❌ cargo-make installation failed or timed out"
              exit 1
            }
          else
            echo "✅ cargo-make is already installed"
            cargo make --version
          fi

          # Verify cargo-make is in PATH and working
          if ! cargo make --version &> /dev/null; then
            echo "❌ cargo-make installation verification failed"
            exit 1
          fi
          echo "✅ cargo-make verified: $(cargo make --version)"


      - name: Make scripts executable
        run: |
          set -e
          echo "Making deployment scripts executable..."
          chmod +x scripts/full_deploy.sh scripts/smoke_real.sh
          chmod +x cosmos/scripts/*.sh
          chmod +x ipfs/scripts/*.sh

          # Verify critical scripts exist
          for script in scripts/full_deploy.sh scripts/smoke_real.sh cosmos/scripts/deploy_all.sh ipfs/scripts/upload_car.sh; do
            if [[ ! -f "$script" ]]; then
              echo "❌ Critical script not found: $script"
              exit 1
            fi
          done
          echo "✅ All deployment scripts verified"

      - name: Full deploy (dry-run)
        if: (github.event_name == 'workflow_dispatch' && inputs.dry_run) || github.event_name == 'push'
        env:
          COSMOS_MNEMONIC: ${{ secrets.COSMOS_MNEMONIC || 'test test test test test test test test test test test junk' }}
          FILEBASE_KEY: ${{ secrets.FILEBASE_KEY || 'test-key' }}
          FILEBASE_SECRET: ${{ secrets.FILEBASE_SECRET || 'test-secret' }}
          I2P_SAM_HOST: ${{ secrets.I2P_SAM_HOST || '127.0.0.1:7656' }}
          ZK_VERIFICATION_KEY: ${{ secrets.ZK_VERIFICATION_KEY || '' }}
        run: |
          set -e
          echo "Running full deploy in dry-run mode..."
          ./scripts/full_deploy.sh --dry-run || {
            echo "❌ Dry-run deployment failed"
            exit 1
          }

      - name: Full deploy (mainnet)
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.use_mainnet
        env:
          COSMOS_MNEMONIC: ${{ secrets.COSMOS_MNEMONIC }}
          FILEBASE_KEY: ${{ secrets.FILEBASE_KEY }}
          FILEBASE_SECRET: ${{ secrets.FILEBASE_SECRET }}
          I2P_SAM_HOST: ${{ secrets.I2P_SAM_HOST }}
          ZK_VERIFICATION_KEY: ${{ secrets.ZK_VERIFICATION_KEY }}
        run: |
          set -e
          echo "Running full deploy to mainnet (osmosis-1)..."
          ./scripts/full_deploy.sh --mainnet || {
            echo "❌ Mainnet deployment failed"
            exit 1
          }

      - name: Full deploy (testnet)
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && !inputs.use_mainnet
        env:
          COSMOS_MNEMONIC: ${{ secrets.COSMOS_MNEMONIC }}
          FILEBASE_KEY: ${{ secrets.FILEBASE_KEY }}
          FILEBASE_SECRET: ${{ secrets.FILEBASE_SECRET }}
          I2P_SAM_HOST: ${{ secrets.I2P_SAM_HOST }}
          ZK_VERIFICATION_KEY: ${{ secrets.ZK_VERIFICATION_KEY }}
        run: |
          set -e
          echo "Running full deploy to testnet (osmo-test-5)..."
          ./scripts/full_deploy.sh || {
            echo "❌ Testnet deployment failed"
            exit 1
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            cosmos/contract/*.json
            ipfs/out/*.car
          if-no-files-found: ignore
