name: PrivaChain CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_TARGET_DIR: ./target
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  # Security scanning job - runs first to fail fast on security issues
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run secret scan
        run: npm run scan:secrets

      - name: Run npm audit
        run: npm audit --audit-level moderate --omit=dev
        continue-on-error: true

      - name: Security scan with Semgrep
        if: github.event_name != 'schedule'
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

  test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: security-scan

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Add wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build smart contracts
        run: npm run contracts:build

      - name: Test smart contracts
        run: npm run contracts:test

      - name: Build FFI
        run: |
          cd rust/crypto/ffi
          cargo build --release

      - name: Install wasm-pack
        run: cargo install wasm-pack || echo "wasm-pack already installed"

      - name: Build DPI-WASM
        run: |
          cd packages/resolver/wasm
          wasm-pack build --target web --out-dir ../src/wasm-pkg

      - name: Ensure no plaintext messages
        run: |
          ! grep -r 'plaintext:' packages/ --include='*.dart' 2>/dev/null | grep -v 'plaintext()' | grep -v '// plaintext()' || echo "No packages directory yet - skipping check"

      - name: Lint frontend code
        run: npm run test:lint

      - name: TypeScript type check
        run: npm run test:build

      - name: Build client
        run: npm run build

      - name: Check bundle for secrets
        run: npm run test:secrets
        if: success()

      - name: Build node binary
        run: cargo build --bin privachain-node --release

      - name: Verify privachain-node binary exists
        run: |
          if [ ! -f ./target/release/privachain-node ]; then
            echo "❌ privachain-node binary not found!"
            echo "Expected location: ./target/release/privachain-node"
            ls -la ./target/release/ || echo "Target directory does not exist"
            exit 1
          fi
          echo "✅ privachain-node binary found at ./target/release/privachain-node"
          ls -lh ./target/release/privachain-node

      - name: Test node without Tor
        run: |
          timeout 10 ./target/release/privachain-node > /tmp/node_test.log 2>&1 &
          PID=$!
          sleep 5
          if ps -p $PID > /dev/null; then
            echo "✅ Node started successfully"
            kill $PID || true
          else
            echo "❌ Node failed to start"
            cat /tmp/node_test.log
            exit 1
          fi

      - name: Test Tor bootstrap (optional)
        run: |
          echo "🕵️ Testing Tor integration..."
          # Note: Full Tor bootstrap requires network access and takes time
          # This test just verifies the node can start with --anonymize flag
          timeout 15 ./target/release/privachain-node --anonymize > /tmp/tor_test.log 2>&1 &
          PID=$!
          sleep 10
          if ps -p $PID > /dev/null; then
            echo "✅ Node started with --anonymize flag"
            kill $PID || true
          else
            echo "⚠️ Tor bootstrap may have failed (expected in CI without Tor network)"
            cat /tmp/tor_test.log || true
          fi
        continue-on-error: true

      - name: Build node with mixnet feature
        run: |
          echo "🕸️ Building with mixnet feature..."
          cargo build --release --features mixnet -p privachain_node
          ls -lh ./target/release/privachain-node

      - name: Test mixnet CLI
        run: |
          echo "Testing --mixnet flag..."
          OUTPUT=$(./target/release/privachain-node --mixnet 2>&1 || true)
          if echo "$OUTPUT" | grep -q "required when using --mixnet"; then
            echo "✅ Mixnet CLI validation works"
          else
            echo "❌ Mixnet CLI validation failed"
            echo "Got: $OUTPUT"
            exit 1
          fi

  # Security summary job
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [security-scan, test]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate security summary
        run: |
          {
            echo "# 🔒 PrivaChain Security Summary"
            echo ""
            echo "**Build Status**: ${{ needs.test.result }}"
            echo "**Security Scan**: ${{ needs.security-scan.result }}"
            echo ""
            echo "## 🚨 Current Security Status"
            echo ""
            echo "- ✅ **Mnemonic Security**: Hardcoded mnemonics removed from frontend"
            echo "- ✅ **Secret Scanning**: Automated detection enabled"
            echo "- ⚠️ **ZK Proofs**: Placeholder implementations (@placeholder @insecure)"
            echo "- ⚠️ **Post-Quantum Crypto**: Placeholder implementations (@placeholder @insecure)"
            echo "- 🚧 **Phase**: Currently in Phase 0 (Stabilization)"
            echo ""
            echo "See [Security Placeholders](./docs/security/placeholders.md) for detailed status."
          } >> "$GITHUB_STEP_SUMMARY"

