name: PrivaChain CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_TARGET_DIR: ./target
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  # Security scanning job - runs first to fail fast on security issues
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run secret scan
        run: npm run scan:secrets

      - name: Run npm audit
        run: npm audit --audit-level moderate --omit=dev
        continue-on-error: true

      - name: Security scan with Semgrep
        if: github.event_name != 'schedule'
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

  test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: security-scan
    
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Add wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/mail/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build smart contracts
        run: npm run contracts:build

      - name: Test smart contracts
        run: npm run contracts:test

      - name: Lint frontend code
        run: npm run test:lint

      - name: TypeScript type check
        run: npm run test:build

      - name: Build client
        run: npm run build

      - name: Check bundle for secrets
        run: npm run test:secrets
        if: success()

  # Security summary job
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [security-scan, test]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate security summary
        run: |
          echo "# 🔒 PrivaChain Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Security Scan**: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚨 Current Security Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Mnemonic Security**: Hardcoded mnemonics removed from frontend" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Secret Scanning**: Automated detection enabled" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ **ZK Proofs**: Placeholder implementations (@placeholder @insecure)" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ **Post-Quantum Crypto**: Placeholder implementations (@placeholder @insecure)" >> $GITHUB_STEP_SUMMARY
          echo "- 🚧 **Phase**: Currently in Phase 0 (Stabilization)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See [Security Placeholders](./docs/security/placeholders.md) for detailed status." >> $GITHUB_STEP_SUMMARY

  # Optional: Add a deployment job for successful builds on main branch
  # deploy:
  #   name: Deploy to staging
  #   runs-on: ubuntu-latest
  #   needs: test
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   steps:
  #     - name: Deploy
  #       run: echo "Deploy to staging environment"