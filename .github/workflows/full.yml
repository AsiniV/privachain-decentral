name: full

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - run: cargo test -p privachain-mail -p did-registry -p privachain-domain-registry -p privachain-recovery-code --release
      - run: cargo clippy -p privachain-mail -p did-registry -p privachain-domain-registry -p privachain-recovery-code --all-targets -- -D warnings
      - run: cargo build -p privachain-mail -p did-registry -p privachain-domain-registry -p privachain-recovery-code --release

  e2e:
    needs: [ts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run e2e

  build-desktop:
    needs: [ts, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install Linux dependencies
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            file \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
      - name: Build Tauri application
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: privachain-desktop-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: privachain-desktop-rpm
          path: target/release/bundle/rpm/*.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: privachain-desktop-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
