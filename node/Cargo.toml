[package]
name = "privachain_node"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libp2p = { version = "0.53", features = ["tcp", "dns", "tokio", "noise", "yamux", "ping", "macros"] }
libp2p-community-tor = "0.4"
directories = "5.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
futures = "0.3"

[lib]
name = "privachain_node"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "privachain-node"
path = "src/main.rs"
