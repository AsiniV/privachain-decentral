[package]
name = "privachain_node"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libp2p = { version = "0.53", features = ["tcp", "dns", "tokio", "noise", "yamux", "ping", "macros"] }
libp2p-community-tor = "0.4"
arti-client = { version = "0.24", features = ["native-tls", "tokio"] }
tor-rtcompat = { version = "0.24", features = ["tokio", "rustls"] }
directories = "5.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
futures = "0.3"
sha2 = "0.10"

# Mixnet stack (using latest available versions) - optional
# Note: Specification called for 0.27 but actual latest on crates.io are older
# nym-sphinx and nym-client-core not available on crates.io yet
# This provides structural support for mixnet - full integration pending availability
nym-crypto = { version = "0.4", optional = true }

[lib]
name = "privachain_node"
crate-type = ["cdylib", "rlib"]

[features]
default = ["mixnet-default"]
mixnet-default = ["dep:nym-crypto"]
fallback-tor = []
post-quantum = []

[[bin]]
name = "privachain-node"
path = "src/main.rs"
