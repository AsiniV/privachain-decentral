[package]
name = "privachain_node"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libp2p = { version = "0.53", features = ["tcp", "dns", "tokio", "noise", "yamux", "ping", "macros"] }
libp2p-community-tor = "0.4"
arti-client = { version = "0.24", features = ["native-tls", "tokio"] }
tor-rtcompat = { version = "0.24", features = ["tokio", "rustls"] }
directories = "5.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "multipart"] }
thiserror = "1.0"

# I2P integration - optional
privachain_i2p = { path = "../rust/i2p", optional = true }

# Crypto integration for PQ features
privachain_crypto = { path = "../rust/crypto", optional = true }

# ZK-proof dependencies (v4.0) - optional
ark-groth16 = { version = "0.4", optional = true }
ark-bls12-381 = { version = "0.4", optional = true }
ark-ff = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }
ark-std = { version = "0.4", optional = true }

# QUIC + ECH dependencies - optional (enabled via quic-ech feature)
libp2p-quic = { version = "0.10", features = ["tokio"], optional = true }
rustls = { version = "0.23", features = ["ring"], optional = true }
hpke = { version = "0.12", optional = true }
tokio-rustls = { version = "0.26", optional = true }

# Shared optional dependencies (used by zk-proofs and quic-ech)
rand = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }

[lib]
name = "privachain_node"
crate-type = ["cdylib", "rlib"]

[features]
default = ["i2p-default", "post-quantum"]
i2p-default = ["dep:privachain_i2p"]
fallback-tor = []
post-quantum = ["dep:privachain_crypto", "privachain_crypto?/post-quantum"]
zk-proofs = ["dep:ark-groth16", "dep:ark-bls12-381", "dep:ark-ff", "dep:ark-serialize", "dep:ark-std", "dep:rand"]
# QUIC + ECH feature: Enables QUIC transport with ECH (Encrypted Client Hello) support
# Usage: cargo build --features quic-ech
quic-ech = ["dep:libp2p-quic", "dep:rustls", "dep:hpke", "dep:tokio-rustls", "dep:rand", "dep:libc"]

[[bin]]
name = "privachain-node"
path = "src/main.rs"

[[bin]]
name = "ech-keygen"
path = "src/bin/ech_keygen.rs"
required-features = ["quic-ech"]

[[bin]]
name = "test_ech_hide"
path = "src/bin/test_ech_hide.rs"
required-features = ["quic-ech"]
